name: Finalize Cloudflare SEO migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-cloudflare-seo.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update HTML metadata and sitemaps
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          old = "https://m0hamedseo-bot.github.io"
          new = "https://m0hamedseo-bot-github-io.pages.dev"

          def normalize(value):
              if not (value.startswith(new) or (value.startswith("/") and not value.startswith("//"))):
                  return value
              match = re.match(r"^([^?#]*)(.*)$", value)
              path, suffix = match.group(1), match.group(2)
              if path.endswith("/index.html"):
                  path = path[:-10]
              elif path.endswith(".html"):
                  path = path[:-5]
              return path + suffix

          attr = re.compile(r"""(?i)(href|content)(\s*=\s*)(["'])(.*?)\3""", re.DOTALL)
          pages = [
              p for p in Path(".").rglob("*.html")
              if ".git" not in p.parts and p.name != "google06c14cd6b5b1a7e5.html"
          ]

          for page in pages:
              data = page.read_text(encoding="utf-8").replace(old, new)

              def rewrite(m):
                  name, equals, quote, value = m.groups()
                  return name + equals + quote + normalize(value) + quote

              data = attr.sub(rewrite, data)
              data = re.sub(
                  re.escape(new) + r"([^\s\"'<>?#]*)\.html(?=([?#\"'\s<]|$))",
                  lambda m: new + m.group(1),
                  data
              )
              page.write_text(data, encoding="utf-8")

          sitemap = Path("sitemap.xml")
          if sitemap.exists():
              old_map = sitemap.read_text(encoding="utf-8")
              Path("sitemap-github-pages.xml").write_text(old_map, encoding="utf-8")
              updated = old_map.replace(old, new)
              updated = re.sub(
                  r"<loc>(.*?)</loc>",
                  lambda m: "<loc>" + normalize(m.group(1)) + "</loc>",
                  updated
              )
              sitemap.write_text(updated, encoding="utf-8")

          robots = Path("robots.txt")
          robots.write_text(
              "User-agent: *\nAllow: /\n\nSitemap: " + new + "/sitemap.xml\n",
              encoding="utf-8"
          )

          text_map = Path("sitemap.txt")
          if text_map.exists():
              lines = [normalize(line.replace(old, new)) for line in text_map.read_text(encoding="utf-8").splitlines()]
              text_map.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # Fail safely if any page still declares the old canonical host.
          for page in pages:
              data = page.read_text(encoding="utf-8")
              if 'rel="canonical"' in data and old in data:
                  raise RuntimeError("Old canonical host remains in " + str(page))

          print("Updated", len(pages), "HTML pages.")
          print("Saved the previous sitemap as sitemap-github-pages.xml.")
          print("Updated canonical, hreflang, Open Graph, JSON-LD, internal URLs and robots.txt.")
          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Cloudflare SEO canonical URLs"
          git push
