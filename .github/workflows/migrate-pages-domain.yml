name: One-time migration to Cloudflare Pages URLs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-pages-domain.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update canonical URLs, language links, internal links, sitemap, and legacy redirects
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          old = "https://m0hamedseo-bot.github.io"
          old_host = "m0hamedseo-bot.github.io"
          new = "https://m0hamedseo-bot-github-io.pages.dev"
          verification_file = "google06c14cd6b5b1a7e5.html"

          def normalize_internal_url(value):
              internal = value.startswith(new) or (value.startswith("/") and not value.startswith("//"))
              if not internal:
                  return value

              if value.startswith(new):
                  prefix = new
                  rest = value[len(new):]
              else:
                  prefix = ""
                  rest = value

              split_at = len(rest)
              for separator in ("?", "#"):
                  pos = rest.find(separator)
                  if pos != -1:
                      split_at = min(split_at, pos)

              path, suffix = rest[:split_at], rest[split_at:]
              if path.endswith("/index.html"):
                  path = path[:-len("index.html")]
              elif path == "/index.html":
                  path = "/"
              elif path.endswith(".html"):
                  path = path[:-5]

              return prefix + path + suffix

          redirect_script = (
              "<script>(function(){"
              "if(location.hostname!=='" + old_host + "')return;"
              "var p=location.pathname;"
              "if(p==='/index.html')p='/';"
              "else if(/\\/index\\.html$/i.test(p))p=p.slice(0,-'index.html'.length);"
              "else if(/\\.html$/i.test(p))p=p.slice(0,-5);"
              "location.replace('" + new + "'+p+location.search+location.hash);"
              "})();</script>"
          )

          html_files = [
              p for p in Path(".").rglob("*.html")
              if ".git" not in p.parts and p.name != verification_file
          ]
          updated_pages = 0

          href_re = re.compile(r'(\\bhref\\s*=\\s*)(["\\'])(.*?)\\2', re.IGNORECASE | re.DOTALL)
          content_re = re.compile(r'(\\bcontent\\s*=\\s*)(["\\'])(.*?)\\2', re.IGNORECASE | re.DOTALL)
          new_url_re = re.compile(re.escape(new) + r'/[^\\s"\\'<>]*')

          for path in html_files:
              text = path.read_text(encoding="utf-8")
              text = text.replace(old, new)

              def rewrite_href(match):
                  value = normalize_internal_url(match.group(3))
                  return match.group(1) + match.group(2) + value + match.group(2)

              def rewrite_content(match):
                  value = match.group(3)
                  if value.startswith(new):
                      value = normalize_internal_url(value)
                  return match.group(1) + match.group(2) + value + match.group(2)

              text = href_re.sub(rewrite_href, text)
              text = content_re.sub(rewrite_content, text)
              text = new_url_re.sub(lambda m: normalize_internal_url(m.group(0)), text)

              if "m0hamedseo-bot.github.io" not in text:
                  raise RuntimeError(f"Legacy redirect hostname missing from generated page: {path}")

              if "location.replace('" + new + "'" not in text:
                  match = re.search(r'<head\\b[^>]*>', text, re.IGNORECASE)
                  if not match:
                      raise RuntimeError(f"No <head> element found in {path}")
                  text = text[:match.end()] + redirect_script + text[match.end():]

              path.write_text(text, encoding="utf-8")
              updated_pages += 1

          sitemap = Path("sitemap.xml")
          if sitemap.exists():
              xml = sitemap.read_text(encoding="utf-8").replace(old, new)
              xml = re.sub(
                  r'<loc>(.*?)</loc>',
                  lambda m: '<loc>' + normalize_internal_url(m.group(1)) + '</loc>',
                  xml
              )
              sitemap.write_text(xml, encoding="utf-8")

          robots = Path("robots.txt")
          if robots.exists():
              txt = robots.read_text(encoding="utf-8").replace(old, new)
              robots.write_text(txt, encoding="utf-8")

          sitemap_txt = Path("sitemap.txt")
          if sitemap_txt.exists():
              lines = sitemap_txt.read_text(encoding="utf-8").splitlines()
              lines = [normalize_internal_url(line.replace(old, new)) for line in lines]
              sitemap_txt.write_text("\\n".join(lines) + "\\n", encoding="utf-8")

          print(f"Updated {updated_pages} HTML pages.")
          print(f"New canonical origin: {new}")
          print("Normalized internal HTML links and sitemap URLs to extensionless Pages routes.")
          print("Added a host-conditional JavaScript redirect on the old GitHub Pages hostname.")
          PY

      - name: Commit migration and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/migrate-pages-domain.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes were generated."
            exit 1
          fi
          git commit -m "Migrate SEO URLs to Cloudflare Pages"
          git push
